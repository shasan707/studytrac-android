name: Build Android app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - run: npm ci
      - run: mkdir -p android/app/src/main/assets && npx cap sync android
      - name: Write signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/study.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.STUDY_KEYSTORE_B64 }}
      - name: Build signed APK
        working-directory: android
        env:
          STUDY_KEYSTORE_PATH: ${{ runner.temp }}/study.keystore
          STUDY_KEYSTORE_PASSWORD: ${{ secrets.STUDY_KEYSTORE_PASSWORD }}
          STUDY_KEY_ALIAS: study
          STUDY_KEY_PASSWORD: ${{ secrets.STUDY_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --quiet
      - name: Name the file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "StudyTracker-1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk StudyTracker-latest.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest StudyTracker-latest.apk "StudyTracker-$VERSION.apk" \
            --title "Study Tracker for Android $VERSION" \
            --notes "Download StudyTracker-latest.apk on your Android phone, open it, and allow installing from this source if asked. Android 9 or newer."
